spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ecom_cart
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka

jwt:
  secret: pY3X+fK0ZpZ1zK0nQeYFq2b7Kz6y5y0R7mGxR8cZx9Q=
  expiration-ms: 36000000
  refresh-expiration-ms: 2592000000
server:
  port: 8085

resilience4j:
  retry:
    instances:
      productService:
        maxAttempts: 3
        waitDuration: 1s

  circuitbreaker:
    instances:
      productService:
        failureRateThreshold: 50
        slidingWindowSize: 4
        waitDurationInOpenState: 10s
        minimumNumberOfCalls: 2

